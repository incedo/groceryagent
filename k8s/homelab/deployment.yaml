apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: grocery-automate
  labels:
    app.kubernetes.io/name: grocery-automate
    app.kubernetes.io/component: catalog-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grocery-automate
      app.kubernetes.io/component: catalog-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grocery-automate
        app.kubernetes.io/component: catalog-service
    spec:
      containers:
        - name: catalog-service
          image: registry.home.intelliworks.nl:5000/grocery-automate/catalog-service:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GROCERY_BACKEND_HOST
              value: 0.0.0.0
            - name: GROCERY_BACKEND_PORT
              value: "8080"
            - name: DATABASE_POOL_SIZE
              value: "4"
            - name: DATABASE_TIMEOUT_MILLIS
              value: "5000"
            - name: PICNIC_TIMEOUT_MILLIS
              value: "15000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: grocery-automate-database
                  key: DATABASE_URL
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: grocery-automate-database
                  key: DATABASE_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grocery-automate-database
                  key: DATABASE_PASSWORD
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
