name: CI/CD

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Multiplatform check
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run quality gate
        run: ./gradlew check --no-daemon

  native-backend:
    name: Build and verify native backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      LOCAL_IMAGE: grocery-catalog-service:${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build native service image
        run: docker build --tag "$LOCAL_IMAGE" .

      - name: Start tested image with PostgreSQL
        env:
          CATALOG_SERVICE_IMAGE: ${{ env.LOCAL_IMAGE }}
        run: docker compose up --no-build --wait

      - name: Verify native service API
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/health/live
          curl --fail --silent --show-error http://127.0.0.1:8080/health/ready
          curl --fail --silent --show-error 'http://127.0.0.1:8080/api/v1/products?query=oats'
          curl --fail --silent --show-error 'http://127.0.0.1:8080/api/v1/events?after=0'
          test "$(docker inspect --format '{{.Config.User}}' grocery-automate-catalog-service-1)" = grocery

      - name: Export tested image
        run: |
          set -euo pipefail
          docker save "$LOCAL_IMAGE" | gzip -1 > /tmp/grocery-catalog-service.tar.gz

      - name: Upload tested image artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: native-catalog-service-${{ github.sha }}
          path: /tmp/grocery-catalog-service.tar.gz
          compression-level: 0
          retention-days: 1

      - name: Show service logs after failure
        if: failure()
        run: docker compose logs --no-color || true

      - name: Stop services
        if: always()
        env:
          CATALOG_SERVICE_IMAGE: ${{ env.LOCAL_IMAGE }}
        run: docker compose down --volumes

  verify-image-artifact:
    name: Verify native image artifact
    needs: native-backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      LOCAL_IMAGE: grocery-catalog-service:${{ github.sha }}

    steps:
      - name: Download tested image artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: native-catalog-service-${{ github.sha }}
          path: /tmp/native-image

      - name: Load and verify tested image
        run: |
          set -euo pipefail
          gzip --decompress --stdout /tmp/native-image/grocery-catalog-service.tar.gz | docker load
          test "$(docker image inspect --format '{{.Config.User}}' "$LOCAL_IMAGE")" = grocery

  publish:
    name: Publish tested native image
    if: github.event_name == 'push'
    needs: [check, verify-image-artifact]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      LOCAL_IMAGE: grocery-catalog-service:${{ github.sha }}
      REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/grocery-catalog-service

    steps:
      - name: Download tested image artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: native-catalog-service-${{ github.sha }}
          path: /tmp/native-image

      - name: Load tested image
        run: gzip --decompress --stdout /tmp/native-image/grocery-catalog-service.tar.gz | docker load

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Publish tested image
        shell: bash
        run: |
          set -euo pipefail
          registry_image="${REGISTRY_IMAGE,,}"
          sha_tag="$registry_image:sha-$GITHUB_SHA"
          docker tag "$LOCAL_IMAGE" "$sha_tag"
          docker push "$sha_tag"

          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            docker tag "$LOCAL_IMAGE" "$registry_image:main"
            docker push "$registry_image:main"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            [[ "$version" =~ ^[0-9][0-9A-Za-z._-]{0,127}$ ]] || {
              echo "Version tag must start with a digit and be a valid container tag." >&2
              exit 1
            }
            docker tag "$LOCAL_IMAGE" "$registry_image:$version"
            docker tag "$LOCAL_IMAGE" "$registry_image:latest"
            docker push "$registry_image:$version"
            docker push "$registry_image:latest"
          fi
