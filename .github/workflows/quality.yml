name: CI/CD

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Multiplatform check
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run quality gate
        run: ./gradlew check --no-daemon

  native-backend:
    name: Build, verify, and deliver native backend
    needs: check
    runs-on: ${{ github.event_name == 'push' && 'homelab' || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      LOCAL_IMAGE: grocery-catalog-service:${{ github.sha }}
      REGISTRY_HOST: registry.home.intelliworks.nl:5000
      REGISTRY_IMAGE: registry.home.intelliworks.nl:5000/grocery-automate/catalog-service

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build native service image
        run: docker build --tag "$LOCAL_IMAGE" .

      - name: Start tested image with PostgreSQL
        env:
          CATALOG_SERVICE_IMAGE: ${{ env.LOCAL_IMAGE }}
        run: docker compose up --no-build --wait

      - name: Verify native service API
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/health/live
          curl --fail --silent --show-error http://127.0.0.1:8080/health/ready
          curl --fail --silent --show-error 'http://127.0.0.1:8080/api/v1/products?query=oats'
          curl --fail --silent --show-error 'http://127.0.0.1:8080/api/v1/events?after=0'
          test "$(docker inspect --format '{{.Config.User}}' grocery-automate-catalog-service-1)" = grocery

      - name: Verify private registry boundary
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          test "$REGISTRY_HOST" = "registry.home.intelliworks.nl:5000"
          curl --fail --silent --show-error "http://$REGISTRY_HOST/v2/"

      - name: Publish tested image to homelab
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          sha_tag="$REGISTRY_IMAGE:sha-$GITHUB_SHA"
          docker tag "$LOCAL_IMAGE" "$sha_tag"
          docker push "$sha_tag"

          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            docker tag "$LOCAL_IMAGE" "$REGISTRY_IMAGE:main"
            docker push "$REGISTRY_IMAGE:main"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            [[ "$version" =~ ^[0-9][0-9A-Za-z._-]{0,127}$ ]] || {
              echo "Version tag must start with a digit and be a valid container tag." >&2
              exit 1
            }
            docker tag "$LOCAL_IMAGE" "$REGISTRY_IMAGE:$version"
            docker tag "$LOCAL_IMAGE" "$REGISTRY_IMAGE:latest"
            docker push "$REGISTRY_IMAGE:$version"
            docker push "$REGISTRY_IMAGE:latest"
          fi

      - name: Show service logs after failure
        if: failure()
        run: docker compose logs --no-color || true

      - name: Stop services
        if: always()
        env:
          CATALOG_SERVICE_IMAGE: ${{ env.LOCAL_IMAGE }}
        run: docker compose down --volumes

      - name: Clean local Docker data
        if: always()
        run: |
          docker container prune -f
          docker image prune -a -f
          docker builder prune -a -f || docker builder prune -f
          docker volume prune -f
