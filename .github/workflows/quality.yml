name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Multiplatform check
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run quality gate
        run: ./gradlew check --no-daemon

  native-backend:
    name: Native backend with PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build and start native service
        run: docker compose up --build --wait

      - name: Verify native service API
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/health/live
          curl --fail --silent --show-error http://127.0.0.1:8080/health/ready
          curl --fail --silent --show-error 'http://127.0.0.1:8080/api/v1/products?query=oats'

      - name: Show service logs after failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down --volumes
