name: grocery-automate

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: grocery
      POSTGRES_USER: grocery
      POSTGRES_PASSWORD: grocery-local
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grocery -d grocery"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - grocery-postgres:/var/lib/postgresql

  catalog-service:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      GROCERY_BACKEND_HOST: 0.0.0.0
      GROCERY_BACKEND_PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/grocery
      DATABASE_USER: grocery
      DATABASE_PASSWORD: grocery-local
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/grocery-catalog-service", "--healthcheck"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  grocery-postgres:
